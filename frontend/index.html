<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F2E7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>NorAI — Turn lecture videos into notes, quizzes &amp; an AI tutor</title>
    <meta name="description" content="Paste a YouTube lecture or upload a class recording. NorAI writes chapter-wise study notes, a revision sheet, quiz and flashcards, plus a tutor that answers from your lecture. Free to start; passes from ₹149." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NorAI" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="NorAI — Turn lecture videos into notes, quizzes &amp; an AI tutor" />
    <meta property="og:description" content="Chapter-wise notes, revision sheet, quiz, flashcards and a lecture-grounded tutor from any lecture video. Free to start; passes from ₹149." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NorAI study notes beside the AI tutor answering a question from the lecture" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="image" href="/landing/notes-and-tutor.webp" type="image/webp" media="(min-width: 768px)" fetchpriority="high" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('norai-theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0B1E3A');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
